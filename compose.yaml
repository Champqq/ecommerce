services:
  redis:
    image: redis:7-alpine
    container_name: ecommerce_redis
    ports:
      - "6379:6379"
    networks:
      - ecommerce_network
    restart: unless-stopped

  database:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: ecommerce
      MYSQL_USER: ecommerce
      MYSQL_PASSWORD: ecommerce
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3308:3306"
    volumes:
      - database_data:/var/lib/mysql
    networks:
      - ecommerce_network

  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecommerce_app
    volumes:
      - .:/var/www/html
    depends_on:
      - database
      - redis
    working_dir: /var/www/html
    environment:
      DATABASE_URL: mysql://ecommerce:ecommerce@database:3306/ecommerce
      REDIS_URL: redis://redis:6379
    ports:
      - "9000:9000"
    networks:
      - ecommerce_network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: ecommerce_nginx
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - ecommerce_network
    restart: unless-stopped

  cron:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecommerce_cron
    volumes:
      - .:/var/www/html
    depends_on:
      - php
      - database
      - redis
    working_dir: /var/www/html
    environment:
      DATABASE_URL: mysql://ecommerce:ecommerce@database:3306/ecommerce
      REDIS_URL: redis://redis:6379
    networks:
      - ecommerce_network
    restart: unless-stopped
    command: >
      sh -c "while true; do
        echo \"[\$(date)] Start sync-product-views...\";
        php /var/www/html/bin/console app:sync-product-views;
        sleep 300;
      done"

  localstack:
    container_name: localstack
    image: localstack/localstack:latest
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3
      - DEBUG=1
      - DATA_DIR=/tmp/localstack/data

volumes:
  database_data:

networks:
  ecommerce_network:
    driver: bridge
